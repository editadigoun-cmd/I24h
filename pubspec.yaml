name: i24h_native
description: I24H — application mobile native de radio, prière et communauté.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.6
  video_player: ^2.10.0
  supabase_flutter: ^2.10.0

# shared_preferences_android 2.5.0 has a known Android release crash
# involving SharedPreferencesApiRegistrar.getAll (R8/Kotlin reflection).
# Pin to the stable 2.4.x line until the upstream fix is available.
dependency_overrides:
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
