name: I24H Flutter CI

on:
  push:
    branches: [main, feature/i24h-premium-home-player]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner
        run: flutter create --platforms=android,ios,web --org com.i24h .
      - name: Get dependencies
        run: flutter pub get
      - name: Run widget smoke tests
        run: flutter test
      - name: Analyze user app
        shell: bash
        run: |
          set +e
          dart analyze lib > analyze.log 2>&1
          analyze_status=$?
          cat analyze.log
          if grep -E ' error - ' analyze.log; then
            exit 1
          fi
          echo "Analyzer exit code: $analyze_status (warnings/info are non-blocking)"
      - name: Add Android microphone permission
        run: sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
      - name: Build Flutter Web for Cloudflare
        run: flutter build web --release
