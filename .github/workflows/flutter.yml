name: I24H Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner
        run: flutter create --platforms=android --org com.i24h .
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze user app
        run: dart analyze lib/main.dart
      - name: Test user app
        run: flutter test test/widget_test.dart
