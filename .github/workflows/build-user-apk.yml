name: Build I24H User APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-user-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create native Android project if missing
        run: flutter create . --platforms=android --project-name=i24h_user
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze user app
        run: dart analyze lib/main.dart
      - name: Build user APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: i24h-user-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
