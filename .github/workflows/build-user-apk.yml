name: Build I24H Android and Web

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create missing Flutter platforms
        run: flutter create . --platforms=android,web --project-name=i24h
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: dart analyze lib
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release --build-name=1.0.1 --build-number=${{ github.run_number }}
      - name: Build Web
        run: flutter build web --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: i24h-user-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: i24h-web-release
          path: build/web
          if-no-files-found: error
