name: Build I24H Android and Web

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create missing Flutter platforms
        run: flutter create . --platforms=android,web --project-name=i24h_native
      - name: Ensure Android microphone permission for LiveKit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          permission = 'android.permission.RECORD_AUDIO'
          if permission not in text:
              lines = text.splitlines()
              index = next((i for i, line in enumerate(lines) if '<manifest' in line), None)
              if index is None:
                  raise SystemExit("Could not find the <manifest> tag.")
              lines.insert(index + 1, '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>')
              manifest.write_text("\n".join(lines) + "\n")
          print("Verified Android microphone permission.")
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --release --build-name=1.0.1 --build-number=${{ github.run_number }}
      - name: Build Web
        run: flutter build web --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: i24h-user-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: i24h-web-release
          path: build/web
          if-no-files-found: error
