name: Build I24H Mobile

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'supabase/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'supabase/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android and web platform files if missing
        run: flutter create . --platforms=android,web --project-name=i24h
      - name: Ensure Android Internet permission
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          lines = manifest.read_text().splitlines()
          permission = 'android.permission.INTERNET'
          if not any(permission in line for line in lines):
              for index, line in enumerate(lines):
                  if '<manifest' in line:
                      lines.insert(index + 1, '    <uses-permission android:name="android.permission.INTERNET"/>')
                      break
              else:
                  raise SystemExit("Could not find the <manifest> tag.")
              manifest.write_text("\\n".join(lines) + "\\n")
          print("Verified Android INTERNET permission.")
          PY
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: dart analyze lib/main.dart
      - name: Build Android APK
        run: >-
          flutter build apk --release
          --build-name=1.0.1
          --build-number=${{ github.run_number }}
          --dart-define=I24H_SUPABASE_URL=https://pwujpjjoxxqupckurrad.supabase.co
          --dart-define=I24H_SUPABASE_PUBLISHABLE_KEY=sb_publishable_u7eKQeWIvlrbMlsHO_uiSw_op8UW9ew
      - name: Build Web
        run: flutter build web --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: i24h-user-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: i24h-web-release
          path: build/web
          if-no-files-found: error
