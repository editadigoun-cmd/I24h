<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="I24H — prière, enseignement et communauté en direct 24h/24.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B3D91">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="I24H">
  <link rel="manifest" href="manifest.json">
  <title>I24H — Prière & Direct</title>
  <style>
    html, body { height: 100%; width: 100%; margin: 0; background: #0B3D91; }
    body { overflow: hidden; }
    #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 14px; color: #fff; font-family: Arial, sans-serif; text-align: center; }
    #loading strong { font-size: 30px; letter-spacing: 3px; }
    #loading span { opacity: .8; font-size: 14px; }
    .spinner { width: 30px; height: 30px; border: 3px solid #ffffff55; border-top-color: #fff; border-radius: 50%; margin: auto; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <strong>I24H</strong>
    <div class="spinner"></div>
    <span>Préparation de votre espace…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading');
      if (loader) loader.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
